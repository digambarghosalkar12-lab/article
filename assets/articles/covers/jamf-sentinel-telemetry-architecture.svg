<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">JAMF Sentinel telemetry architecture</title>
  <desc id="desc">JAMF installs and configures a macOS LaunchDaemon. Multiple script blocks create local events that are logged and securely delivered through Azure to Microsoft Sentinel.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131c"/><stop offset="1" stop-color="#123b4d"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="54" y="65" fill="#f8fafc" font-size="30" font-weight="700">Two control planes, one reliable telemetry path</text>
    <text x="54" y="98" fill="#b9d0da" font-size="17">JAMF manages intent · macOS executes locally · Azure authenticates delivery · Sentinel stores history</text>
    <g fill="#102a39" stroke="#38bdf8">
      <rect x="54" y="170" width="190" height="130" rx="18"/>
      <rect x="310" y="150" width="250" height="170" rx="18"/>
      <rect x="626" y="170" width="190" height="130" rx="18"/>
      <rect x="882" y="170" width="190" height="130" rx="18"/>
      <rect x="1138" y="170" width="96" height="130" rx="18"/>
    </g>
    <g text-anchor="middle">
      <text x="149" y="218" fill="#f8fafc" font-size="22" font-weight="700">JAMF Pro</text><text x="149" y="250" fill="#c5d9e2" font-size="15">Install policy</text><text x="149" y="274" fill="#c5d9e2" font-size="15">Configuration profile</text>
      <text x="435" y="191" fill="#f8fafc" font-size="22" font-weight="700">macOS LaunchDaemon</text><text x="435" y="226" fill="#99f6e4" font-size="15">Script A · schedule A · state A</text><text x="435" y="253" fill="#99f6e4" font-size="15">Script B · schedule B · state B</text><text x="435" y="280" fill="#99f6e4" font-size="15">Script N · schedule N · state N</text><text x="435" y="304" fill="#c5d9e2" font-size="13">Serial execution · 15-minute timeout</text>
      <text x="721" y="218" fill="#f8fafc" font-size="22" font-weight="700">Local durability</text><text x="721" y="250" fill="#c5d9e2" font-size="15">Rotating JSONL</text><text x="721" y="274" fill="#c5d9e2" font-size="15">State + spool</text>
      <text x="977" y="218" fill="#f8fafc" font-size="22" font-weight="700">Azure gateway</text><text x="977" y="250" fill="#c5d9e2" font-size="15">mTLS + validation</text><text x="977" y="274" fill="#c5d9e2" font-size="15">Ack + dedup + DCR</text>
      <text x="1186" y="218" fill="#f8fafc" font-size="18" font-weight="700">Sentinel</text><text x="1186" y="250" fill="#c5d9e2" font-size="13">Custom</text><text x="1186" y="270" fill="#c5d9e2" font-size="13">table</text>
    </g>
    <g stroke="#7dd3fc" stroke-width="4" marker-end="url(#a)"><path d="M244 235h54"/><path d="M560 235h54"/><path d="M816 235h54"/><path d="M1072 235h54"/></g>
    <rect x="54" y="390" width="570" height="238" rx="20" fill="#0a202c" stroke="#2e5364"/>
    <text x="86" y="432" fill="#f8fafc" font-size="21" font-weight="700">What remains global</text>
    <g fill="#c9dce4" font-size="16"><text x="86" y="473">• Main enable switch</text><text x="86" y="506">• Log retention and rotation size</text><text x="86" y="539">• Gateway, certificate, batch and spool limits</text><text x="86" y="572">• launchd lifecycle and installation</text></g>
    <rect x="656" y="390" width="578" height="238" rx="20" fill="#0a202c" stroke="#2e5364"/>
    <text x="688" y="432" fill="#f8fafc" font-size="21" font-weight="700">What belongs to each script block</text>
    <g fill="#c9dce4" font-size="16"><text x="688" y="473">• Enable switch, script, hash and event code</text><text x="688" y="506">• Output format, count and redaction</text><text x="688" y="539">• Interval or ongoing frequency</text><text x="688" y="572">• Device-local date range and weekdays</text></g>
    <text x="54" y="680" fill="#7dd3fc" font-size="15">Defender-native events continue through the Defender XDR connector; custom script telemetry uses the Azure gateway.</text>
  </g>
</svg>

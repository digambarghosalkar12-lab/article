<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Mac total cost of ownership model</title>
  <desc id="desc">A TCO model showing that purchase price is only one part of enterprise endpoint cost.</desc>
  <rect width="1280" height="720" fill="#f7f5ef"/>
  <text x="80" y="86" fill="#081012" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">TCO is not purchase price</text>
  <text x="82" y="124" fill="#53635e" font-family="Inter, Arial, sans-serif" font-size="20">Measure the full lifecycle before judging whether Mac is expensive or efficient.</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(78 190)">
      <rect width="1124" height="120" rx="24" fill="#081012"/>
      <text x="562" y="52" text-anchor="middle" fill="#f7f5ef" font-size="30" font-weight="800">True endpoint cost</text>
      <text x="562" y="88" text-anchor="middle" fill="#d6c8a8" font-size="18">Hardware + deployment + management + software + security + support + downtime - residual value</text>
    </g>
    <g transform="translate(96 366)">
      <rect width="154" height="150" rx="20" fill="#fff" stroke="#d7d0c1"/>
      <text x="77" y="62" text-anchor="middle" fill="#081012" font-size="20" font-weight="800">Hardware</text>
      <text x="77" y="96" text-anchor="middle" fill="#53635e" font-size="16">Device cost</text>
    </g>
    <g transform="translate(272 366)">
      <rect width="154" height="150" rx="20" fill="#fffaf0" stroke="#d7d0c1"/>
      <text x="77" y="62" text-anchor="middle" fill="#081012" font-size="20" font-weight="800">Deploy</text>
      <text x="77" y="96" text-anchor="middle" fill="#53635e" font-size="16">Zero touch</text>
    </g>
    <g transform="translate(448 366)">
      <rect width="154" height="150" rx="20" fill="#eef8f5" stroke="#d7d0c1"/>
      <text x="77" y="62" text-anchor="middle" fill="#081012" font-size="20" font-weight="800">Manage</text>
      <text x="77" y="96" text-anchor="middle" fill="#53635e" font-size="16">Jamf flow</text>
    </g>
    <g transform="translate(624 366)">
      <rect width="154" height="150" rx="20" fill="#edf5ff" stroke="#d7d0c1"/>
      <text x="77" y="62" text-anchor="middle" fill="#081012" font-size="20" font-weight="800">Secure</text>
      <text x="77" y="96" text-anchor="middle" fill="#53635e" font-size="16">Defender</text>
    </g>
    <g transform="translate(800 366)">
      <rect width="154" height="150" rx="20" fill="#fff3e8" stroke="#d7d0c1"/>
      <text x="77" y="62" text-anchor="middle" fill="#081012" font-size="20" font-weight="800">Support</text>
      <text x="77" y="96" text-anchor="middle" fill="#53635e" font-size="16">AppleCare</text>
    </g>
    <g transform="translate(976 366)">
      <rect width="154" height="150" rx="20" fill="#f1f4ea" stroke="#d7d0c1"/>
      <text x="77" y="62" text-anchor="middle" fill="#081012" font-size="20" font-weight="800">Residual</text>
      <text x="77" y="96" text-anchor="middle" fill="#53635e" font-size="16">Subtract value</text>
    </g>
  </g>
  <text x="640" y="616" text-anchor="middle" fill="#081012" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">A higher device price can still win when support, deployment, downtime, and resale improve.</text>
</svg>

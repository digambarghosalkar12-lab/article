<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Local-first EUC migration architecture</title>
  <desc id="desc">Diagram showing staged local assets, LaunchDaemon monitoring, old Jamf removal, new MDM enrollment, and local validation.</desc>
  <rect width="1280" height="720" fill="#f7f5ef"/>
  <style>
    .title{font:700 34px Arial,Helvetica,sans-serif;fill:#081012}
    .sub{font:400 18px Arial,Helvetica,sans-serif;fill:#59645d}
    .box{fill:#fffaf0;stroke:#123230;stroke-width:3}
    .dark{fill:#123230}
    .gold{fill:#d1a05f}
    .txt{font:700 22px Arial,Helvetica,sans-serif;fill:#081012}
    .small{font:400 17px Arial,Helvetica,sans-serif;fill:#3b4642}
    .white{fill:#f7f5ef}
    .line{fill:none;stroke:#123230;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .dash{fill:none;stroke:#6d786f;stroke-width:3;stroke-dasharray:10 10;stroke-linecap:round}
  </style>
  <text x="60" y="62" class="title">Local-first macOS MDM migration</text>
  <text x="60" y="96" class="sub">The Mac carries the migration engine locally, so the workflow survives after the old MDM channel is removed.</text>

  <rect x="60" y="160" width="250" height="142" rx="14" class="box"/>
  <text x="88" y="205" class="txt">Pre-stage</text>
  <text x="88" y="238" class="small">Scripts, dialog assets,</text>
  <text x="88" y="264" class="small">API config, LaunchDaemon</text>

  <rect x="390" y="160" width="250" height="142" rx="14" class="box"/>
  <text x="418" y="205" class="txt">Local daemon</text>
  <text x="418" y="238" class="small">Runs independently</text>
  <text x="418" y="264" class="small">and monitors state</text>

  <rect x="720" y="160" width="250" height="142" rx="14" class="box"/>
  <text x="748" y="205" class="txt">MDM bridge</text>
  <text x="748" y="238" class="small">Remove old Jamf MDM</text>
  <text x="748" y="264" class="small">start new enrollment</text>

  <rect x="970" y="430" width="250" height="142" rx="14" class="box"/>
  <text x="998" y="475" class="txt">Validated Mac</text>
  <text x="998" y="508" class="small">Profiles, FileVault,</text>
  <text x="998" y="534" class="small">bootstrap token, users</text>

  <path d="M310 231h80M640 231h80M845 302c0 115 80 199 125 199" class="line"/>
  <path d="M515 302v260c0 44 35 79 79 79h415" class="dash"/>
  <circle cx="515" cy="558" r="54" class="dark"/>
  <text x="515" y="552" text-anchor="middle" class="white" style="font:700 18px Arial">retry</text>
  <text x="515" y="576" text-anchor="middle" class="white" style="font:700 18px Arial">loop</text>

  <rect x="100" y="430" width="280" height="142" rx="14" fill="#e9e4d9" stroke="#d1a05f" stroke-width="3"/>
  <text x="128" y="475" class="txt">Swift Dialog</text>
  <text x="128" y="508" class="small">Guides the user, requests</text>
  <text x="128" y="534" class="small">auth, shows progress</text>
  <path d="M380 501h82" class="line"/>
</svg>

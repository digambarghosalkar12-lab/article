<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">CloudX context building flow</title><desc id="desc">A user request becomes a TaskObject, passes through a read-only Context Builder, and leaves as a bounded ContextPackage. Step 3 remains future work.</desc>
  <rect width="1280" height="420" fill="#102747"/><circle cx="1210" cy="-30" r="190" fill="#7657e8" opacity=".17"/><circle cx="20" cy="440" r="170" fill="#56c2dd" opacity=".1"/>
  <g font-family="Arial,Helvetica,sans-serif"><text x="60" y="58" fill="#76d9eb" font-size="14" font-weight="700" letter-spacing="4">CLOUDX · CONTEXT BUILDER</text><text x="60" y="108" fill="#f7f5ef" font-size="34" font-weight="700">Gather evidence before deciding what to do</text><text x="60" y="140" fill="#b7c5d9" font-size="17">Read only. Bounded. Deterministic. Transparent about what is missing.</text>
    <g transform="translate(60 220)"><rect width="184" height="112" rx="10" fill="#f7f5ef"/><text x="20" y="34" fill="#6d786f" font-size="12" font-weight="700" letter-spacing="2">STEP 1 OUTPUT</text><text x="20" y="72" fill="#102747" font-size="20" font-weight="700">TaskObject</text><text x="20" y="96" fill="#526271" font-size="14">intent preserved</text></g>
    <path d="M260 276h58" stroke="#76d9eb" stroke-width="3"/><path d="m306 264 12 12-12 12" fill="none" stroke="#76d9eb" stroke-width="3"/>
    <g transform="translate(334 196)"><rect width="286" height="160" rx="80" fill="#59c4de"/><text x="143" y="62" text-anchor="middle" fill="#102747" font-size="23" font-weight="700">Context Builder</text><text x="143" y="94" text-anchor="middle" fill="#102747" font-size="13" font-weight="700" letter-spacing="2">AUTHORIZE · RANK · LOAD</text><text x="143" y="121" text-anchor="middle" fill="#102747" font-size="13" letter-spacing="2">ASSEMBLE · EXPLAIN</text></g>
    <path d="M636 276h58" stroke="#8d6ff1" stroke-width="3"/><path d="m682 264 12 12-12 12" fill="none" stroke="#8d6ff1" stroke-width="3"/>
    <g transform="translate(710 220)"><rect width="212" height="112" rx="10" fill="#f7f5ef"/><text x="20" y="34" fill="#6d786f" font-size="12" font-weight="700" letter-spacing="2">VALIDATED OUTPUT</text><text x="20" y="70" fill="#102747" font-size="20" font-weight="700">ContextPackage</text><text x="20" y="96" fill="#526271" font-size="14">bounded evidence</text></g>
    <path d="M938 276h62" stroke="#8397b7" stroke-width="3" stroke-dasharray="8 8"/><path d="m988 264 12 12-12 12" fill="none" stroke="#8397b7" stroke-width="3"/>
    <g transform="translate(1016 220)"><rect width="204" height="112" rx="10" fill="#182e56" stroke="#8397b7" stroke-dasharray="7 6"/><text x="20" y="34" fill="#b7c5d9" font-size="12" font-weight="700" letter-spacing="2">NOT STARTED</text><text x="20" y="70" fill="#f7f5ef" font-size="20" font-weight="700">Step 3</text><text x="20" y="96" fill="#b7c5d9" font-size="14">agent / tool loop</text></g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Codex native local coding workspace</title>
  <desc id="desc">Square article card for AI Codex, a native local-first macOS coding agent with routing, activity, changes, and local models.</desc>
  <rect width="900" height="900" fill="#081012"/>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#13242b"/>
      <stop offset="0.55" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#1c1740"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#69d6ff"/>
      <stop offset="1" stop-color="#8f7cff"/>
    </linearGradient>
  </defs>
  <circle cx="175" cy="735" r="150" fill="#123230" opacity=".62"/>
  <circle cx="700" cy="168" r="132" fill="#233d83" opacity=".48"/>
  <rect x="118" y="150" width="664" height="578" rx="42" fill="url(#panel)" stroke="#314259"/>
  <text x="178" y="248" fill="#f7f5ef" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900">AI Codex</text>
  <text x="180" y="302" fill="#b8c7d6" font-family="Inter, Arial, sans-serif" font-size="26">Local-first macOS coding agent</text>
  <rect x="180" y="372" width="252" height="118" rx="22" fill="#111827" stroke="#334155"/>
  <circle cx="212" cy="412" r="9" fill="#ff5f57"/>
  <circle cx="240" cy="412" r="9" fill="#febc2e"/>
  <circle cx="268" cy="412" r="9" fill="#28c840"/>
  <text x="210" y="459" fill="#f7f5ef" font-family="Menlo, Consolas, monospace" font-size="22">$ aicodex run</text>
  <rect x="504" y="372" width="188" height="118" rx="22" fill="#eef8f5" opacity=".96"/>
  <text x="598" y="424" text-anchor="middle" fill="#081012" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Ask</text>
  <text x="598" y="460" text-anchor="middle" fill="#081012" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Plan</text>
  <text x="598" y="496" text-anchor="middle" fill="#081012" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Code</text>
  <path d="M210 604 C310 492 455 668 625 536" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  <path d="M620 536 l-42 -5 M620 536 l-24 36" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  <text x="180" y="676" fill="#f7f5ef" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Activity • Changes • Local Models</text>
</svg>

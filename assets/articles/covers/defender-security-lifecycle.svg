<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Defender security lifecycle</title>
  <desc id="desc">A polished four-stage Defender lifecycle showing investigation, validation, remediation, and protection.</desc>
  <rect width="1280" height="720" fill="#f7f5ef"/>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#081012" flood-opacity=".1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#6d786f"/>
    </marker>
  </defs>
  <style>
    .title{font:700 34px Arial,Helvetica,sans-serif;fill:#081012}
    .sub{font:400 18px Arial,Helvetica,sans-serif;fill:#59645d}
    .card{fill:#fffaf0;stroke-width:2.5;filter:url(#shadow)}
    .h{font:700 21px Arial,Helvetica,sans-serif}
    .p{font:400 14px Arial,Helvetica,sans-serif;fill:#3b4642}
    .num{font:700 16px Arial,Helvetica,sans-serif;fill:#f7f5ef}
    .line{fill:none;stroke:#6d786f;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
    .blue{fill:#2f6df6;stroke:#2f6df6}
    .red{fill:#dd2016;stroke:#dd2016}
    .green{fill:#12a15d;stroke:#12a15d}
    .yellow{fill:#f4ad00;stroke:#f4ad00}
    .softBlue{fill:#eaf1ff;stroke:#2f6df6}
    .softRed{fill:#fff0ee;stroke:#dd2016}
    .softGreen{fill:#eaf8f1;stroke:#12a15d}
    .softYellow{fill:#fff7df;stroke:#f4ad00}
    .icon{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <text x="60" y="62" class="title">Defender onboarding lifecycle</text>
  <text x="60" y="96" class="sub">The onboarding target is an operating loop, not just endpoint agent deployment.</text>

  <rect x="60" y="170" width="245" height="390" rx="24" class="card" stroke="#2f6df6"/>
  <circle cx="96" cy="206" r="18" class="blue"/><text x="96" y="212" text-anchor="middle" class="num">1</text>
  <circle cx="182" cy="266" r="58" class="softBlue" stroke-width="4"/>
  <circle cx="168" cy="255" r="25" class="icon" stroke="#2f6df6"/>
  <line x1="188" y1="276" x2="216" y2="304" class="icon" stroke="#2f6df6"/>
  <text x="182" y="372" text-anchor="middle" class="h" fill="#2f6df6">Investigation</text>
  <text x="92" y="414" class="p">Collect telemetry from</text>
  <text x="92" y="436" class="p">endpoints, identity, email,</text>
  <text x="92" y="458" class="p">cloud apps, browsers,</text>
  <text x="92" y="480" class="p">network, and devices.</text>
  <text x="92" y="522" class="p">Outcome: complete timeline.</text>

  <rect x="365" y="170" width="245" height="390" rx="24" class="card" stroke="#dd2016"/>
  <circle cx="401" cy="206" r="18" class="red"/><text x="401" y="212" text-anchor="middle" class="num">2</text>
  <circle cx="487" cy="266" r="58" class="softRed" stroke-width="4"/>
  <path d="M456 266l21 21 42-50" class="icon" stroke="#dd2016"/>
  <line x1="456" y1="307" x2="522" y2="307" class="icon" stroke="#dd2016"/>
  <text x="487" y="372" text-anchor="middle" class="h" fill="#dd2016">Validation</text>
  <text x="397" y="414" class="p">Correlate alerts with AI,</text>
  <text x="397" y="436" class="p">threat intelligence, asset</text>
  <text x="397" y="458" class="p">criticality, user risk, IOCs,</text>
  <text x="397" y="480" class="p">and MITRE mapping.</text>
  <text x="397" y="522" class="p">Outcome: prioritized truth.</text>

  <rect x="670" y="170" width="245" height="390" rx="24" class="card" stroke="#12a15d"/>
  <circle cx="706" cy="206" r="18" class="green"/><text x="706" y="212" text-anchor="middle" class="num">3</text>
  <circle cx="792" cy="266" r="58" class="softGreen" stroke-width="4"/>
  <path d="M765 294l55-55" class="icon" stroke="#12a15d"/>
  <circle cx="812" cy="246" r="18" fill="#eaf8f1" stroke="#12a15d" stroke-width="6"/>
  <path d="M770 289l-14 20" class="icon" stroke="#12a15d"/>
  <text x="792" y="372" text-anchor="middle" class="h" fill="#12a15d">Remediation</text>
  <text x="702" y="414" class="p">Isolate devices, remove</text>
  <text x="702" y="436" class="p">malware, revoke sessions,</text>
  <text x="702" y="458" class="p">clean email, block IOCs,</text>
  <text x="702" y="480" class="p">and launch playbooks.</text>
  <text x="702" y="522" class="p">Outcome: fast containment.</text>

  <rect x="975" y="170" width="245" height="390" rx="24" class="card" stroke="#f4ad00"/>
  <circle cx="1011" cy="206" r="18" class="yellow"/><text x="1011" y="212" text-anchor="middle" class="num">4</text>
  <circle cx="1097" cy="266" r="58" class="softYellow" stroke-width="4"/>
  <path d="M1097 220l42 18v31c0 30-19 54-42 66-23-12-42-36-42-66v-31z" class="icon" stroke="#f4ad00"/>
  <path d="M1078 270l14 14 31-38" class="icon" stroke="#f4ad00"/>
  <text x="1097" y="372" text-anchor="middle" class="h" fill="#f4ad00">Protection</text>
  <text x="1007" y="414" class="p">Harden with ASR, EDR,</text>
  <text x="1007" y="436" class="p">AV, vulnerability fixes,</text>
  <text x="1007" y="458" class="p">web/network protection,</text>
  <text x="1007" y="480" class="p">and secure score work.</text>
  <text x="1007" y="522" class="p">Outcome: reduced exposure.</text>

  <path d="M305 365h58" class="line"/>
  <path d="M610 365h58" class="line"/>
  <path d="M915 365h58" class="line"/>
</svg>

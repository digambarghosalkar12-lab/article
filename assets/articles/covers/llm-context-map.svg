<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">Context changes the meaning of the word bank</title><rect width="1280" height="720" fill="#e9e4d9"/><g font-family="Arial,sans-serif"><text x="80" y="96" fill="#61736b" font-size="18" letter-spacing="4">CONTEXT</text><text x="80" y="157" fill="#173b37" font-size="48" font-weight="700">The same word can mean different things</text><text x="80" y="201" fill="#52635d" font-size="24">The words around it tell us which meaning fits the moment.</text></g><g stroke="#397568" stroke-width="5" fill="none"><path d="M640 372C520 372 487 333 380 333M640 372c-120 0-153 104-260 104"/></g><circle cx="640" cy="372" r="98" fill="#153c38"/><text x="640" y="384" fill="#edf5ed" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle">bank</text><g font-family="Arial,sans-serif"><rect x="110" y="257" width="275" height="152" rx="18" fill="#d8f0e1"/><text x="138" y="310" fill="#173b37" font-size="22">“I went to the bank</text><text x="138" y="341" fill="#173b37" font-size="22">to deposit money.”</text><text x="138" y="385" fill="#3e7667" font-size="19" font-weight="700">Financial place</text><rect x="110" y="438" width="275" height="152" rx="18" fill="#c9e0ed"/><text x="138" y="491" fill="#173b37" font-size="22">“I sat on the bank</text><text x="138" y="522" fill="#173b37" font-size="22">of a river.”</text><text x="138" y="566" fill="#3e7667" font-size="19" font-weight="700">River edge</text><text x="766" y="349" fill="#173b37" font-size="31" font-weight="700">Better context</text><text x="766" y="393" fill="#52635d" font-size="25">helps people—and AI—</text><text x="766" y="428" fill="#52635d" font-size="25">choose the right meaning.</text></g></svg>

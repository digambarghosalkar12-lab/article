<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">CloudX provider-neutral architecture</title>
  <desc id="desc">CloudX validates an input envelope, uses an approved model provider, validates structured output, and returns a Task Object.</desc>
  <rect width="1280" height="720" fill="#f7f5ef"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="62" fill="#6d786f" font-size="14" font-weight="700" letter-spacing="4">PROVIDER-NEUTRAL ARCHITECTURE</text>
    <text x="64" y="112" fill="#081012" font-size="38" font-weight="700">A stable understanding boundary</text>
    <text x="64" y="145" fill="#52605d" font-size="18">The model can change. The Task Object contract stays consistent.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(64 238)">
      <rect width="190" height="160" rx="10" fill="#102747"/>
      <text x="20" y="38" fill="#76d9eb" font-size="12" font-weight="700" letter-spacing="2">01 · INPUT</text>
      <text x="20" y="78" fill="#fff" font-size="18" font-weight="700">User request</text>
      <text x="20" y="108" fill="#b7c5d9" font-size="16">Immediate context</text>
      <text x="20" y="136" fill="#b7c5d9" font-size="16">No hidden history</text>
    </g>

    <g transform="translate(300 220)">
      <rect width="218" height="196" rx="10" fill="#173832"/>
      <text x="20" y="38" fill="#90e1cd" font-size="12" font-weight="700" letter-spacing="2">02 · CLOUDX API</text>
      <text x="20" y="78" fill="#fff" font-size="17">Validate input</text>
      <text x="20" y="110" fill="#fff" font-size="17">Read configuration</text>
      <text x="20" y="142" fill="#fff" font-size="17">Build schema request</text>
      <text x="20" y="174" fill="#fff" font-size="17">Enforce timeout</text>
    </g>

    <g transform="translate(564 200)">
      <rect width="218" height="236" rx="10" fill="#e9e4d9" stroke="#081012" stroke-opacity=".18"/>
      <text x="20" y="38" fill="#6d786f" font-size="12" font-weight="700" letter-spacing="2">03 · MODEL PROVIDER</text>
      <rect x="20" y="61" width="178" height="42" rx="6" fill="#39204d"/><text x="109" y="88" fill="#fff" font-size="15" text-anchor="middle">Local Ollama</text>
      <rect x="20" y="113" width="178" height="42" rx="6" fill="#263d84"/><text x="109" y="140" fill="#fff" font-size="15" text-anchor="middle">Microsoft Foundry</text>
      <rect x="20" y="165" width="178" height="42" rx="6" fill="#641832"/><text x="109" y="192" fill="#fff" font-size="15" text-anchor="middle">Amazon Bedrock</text>
    </g>

    <g transform="translate(828 220)">
      <rect width="200" height="196" rx="10" fill="#183456"/>
      <text x="20" y="38" fill="#76d9eb" font-size="12" font-weight="700" letter-spacing="2">04 · VALIDATE</text>
      <text x="20" y="78" fill="#fff" font-size="17">Parse JSON</text>
      <text x="20" y="110" fill="#fff" font-size="17">Check schema</text>
      <text x="20" y="142" fill="#fff" font-size="17">Preserve prompt</text>
      <text x="20" y="174" fill="#fff" font-size="17">Resolve references</text>
    </g>

    <g transform="translate(1074 238)">
      <rect width="142" height="160" rx="10" fill="#081012"/>
      <text x="18" y="38" fill="#76d9eb" font-size="12" font-weight="700" letter-spacing="2">05 · OUTPUT</text>
      <text x="18" y="78" fill="#fff" font-size="18" font-weight="700">Task Object</text>
      <path d="M18 104h76M18 128h104" stroke="#b7c5d9" stroke-width="4" stroke-linecap="round" opacity=".65"/>
      <circle cx="116" cy="105" r="8" fill="#54c99b"/>
    </g>
  </g>

  <g fill="none" stroke="#081012" stroke-width="2.5" stroke-linecap="round">
    <path d="M266 318h22"/><path d="m278 309 10 9-10 9"/>
    <path d="M530 318h22"/><path d="m542 309 10 9-10 9"/>
    <path d="M794 318h22"/><path d="m806 309 10 9-10 9"/>
    <path d="M1040 318h22"/><path d="m1052 309 10 9-10 9"/>
  </g>

  <line x1="64" y1="510" x2="1216" y2="510" stroke="#081012" opacity=".18"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="558" fill="#6d786f" font-size="13" font-weight="700" letter-spacing="3">MAINTAINER CONTROL PLANE</text>
    <text x="64" y="596" fill="#081012" font-size="19" font-weight="700">Provider · model · endpoint · region · temperature · timeout</text>
    <rect x="64" y="626" width="1152" height="48" rx="8" fill="#e9e4d9"/>
    <circle cx="91" cy="650" r="8" fill="#54c99b"/>
    <text x="112" y="657" fill="#52605d" font-size="16">Secrets stay outside editable configuration—in environment variables, workload identity, IAM roles, or a secret manager.</text>
  </g>
</svg>

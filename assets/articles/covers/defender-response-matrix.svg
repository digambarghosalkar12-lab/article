<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Defender response matrix</title>
  <desc id="desc">A response matrix showing endpoint, identity, email, network, and cloud remediation actions.</desc>
  <rect width="1280" height="720" fill="#f7f5ef"/>
  <style>
    .title{font:700 34px Arial,Helvetica,sans-serif;fill:#081012}
    .sub{font:400 18px Arial,Helvetica,sans-serif;fill:#59645d}
    .lane{fill:#fffaf0;stroke:#123230;stroke-width:2}
    .head{font:700 19px Arial,Helvetica,sans-serif;fill:#081012}
    .p{font:400 14px Arial,Helvetica,sans-serif;fill:#3b4642}
    .chip{fill:#e9e4d9;stroke:#d1a05f;stroke-width:2}
    .chipText{font:700 14px Arial,Helvetica,sans-serif;fill:#081012}
  </style>
  <text x="60" y="62" class="title">Response is multi-domain</text>
  <text x="60" y="96" class="sub">A confirmed incident can trigger endpoint, identity, email, network, and cloud actions from one operating model.</text>

  <rect x="55" y="150" width="220" height="430" rx="20" class="lane"/>
  <text x="85" y="192" class="head">Endpoint</text>
  <text x="85" y="228" class="p">Isolate devices</text>
  <text x="85" y="254" class="p">Quarantine files</text>
  <text x="85" y="280" class="p">Kill processes</text>
  <text x="85" y="306" class="p">Start AV scans</text>
  <text x="85" y="332" class="p">Collect packages</text>
  <text x="85" y="358" class="p">Live Response</text>

  <rect x="300" y="150" width="220" height="430" rx="20" class="lane"/>
  <text x="330" y="192" class="head">Identity</text>
  <text x="330" y="228" class="p">Disable accounts</text>
  <text x="330" y="254" class="p">Force reset</text>
  <text x="330" y="280" class="p">Revoke sessions</text>
  <text x="330" y="306" class="p">Trigger CA policy</text>
  <text x="330" y="332" class="p">Review user risk</text>

  <rect x="545" y="150" width="220" height="430" rx="20" class="lane"/>
  <text x="575" y="192" class="head">Email</text>
  <text x="575" y="228" class="p">Remove phishing</text>
  <text x="575" y="254" class="p">Quarantine attach.</text>
  <text x="575" y="280" class="p">Block senders</text>
  <text x="575" y="306" class="p">Block URLs</text>
  <text x="575" y="332" class="p">Block hashes</text>

  <rect x="790" y="150" width="220" height="430" rx="20" class="lane"/>
  <text x="820" y="192" class="head">Network</text>
  <text x="820" y="228" class="p">Block IPs</text>
  <text x="820" y="254" class="p">Block domains</text>
  <text x="820" y="280" class="p">Block URLs</text>
  <text x="820" y="306" class="p">Update firewall</text>
  <text x="820" y="332" class="p">Review connections</text>

  <rect x="1035" y="150" width="190" height="430" rx="20" class="lane"/>
  <text x="1065" y="192" class="head">Cloud</text>
  <text x="1065" y="228" class="p">Disable OAuth</text>
  <text x="1065" y="254" class="p">Remove sharing</text>
  <text x="1065" y="280" class="p">Block apps</text>
  <text x="1065" y="306" class="p">Review exposure</text>
  <text x="1065" y="332" class="p">Harden posture</text>

  <rect x="354" y="625" width="572" height="52" rx="18" class="chip"/>
  <text x="640" y="657" text-anchor="middle" class="chipText">Goal: reduce time from detection to containment and make response repeatable.</text>
</svg>

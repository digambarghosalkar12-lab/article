<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AWS maturity decision curve</title>
  <desc id="desc">A clean graph showing how AWS architecture decisions grow from baseline resilience to containers, serverless, multi-account governance, edge controls, and documentation.</desc>
  <rect width="1280" height="720" fill="#f7f5ef"/>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#081012" flood-opacity=".1"/>
    </filter>
  </defs>
  <style>
    .title{font:700 34px Arial,Helvetica,sans-serif;fill:#081012}
    .sub{font:400 18px Arial,Helvetica,sans-serif;fill:#59645d}
    .axis{stroke:#123230;stroke-width:3;stroke-linecap:round}
    .grid{stroke:#d8d2c6;stroke-width:1.5}
    .curve{fill:none;stroke:#123230;stroke-width:7;stroke-linecap:round}
    .dot{fill:#d1a05f;stroke:#123230;stroke-width:4}
    .card{fill:#fffaf0;stroke:#123230;stroke-width:2;filter:url(#shadow)}
    .h{font:700 18px Arial,Helvetica,sans-serif;fill:#081012}
    .p{font:400 14px Arial,Helvetica,sans-serif;fill:#3b4642}
    .label{font:700 16px Arial,Helvetica,sans-serif;fill:#59645d}
  </style>
  <text x="60" y="62" class="title">How the AWS platform should grow</text>
  <text x="60" y="96" class="sub">Add services when the workload pressure justifies the operational cost.</text>

  <line x1="115" y1="575" x2="115" y2="160" class="axis"/>
  <line x1="115" y1="575" x2="1130" y2="575" class="axis"/>
  <line x1="115" y1="470" x2="1130" y2="470" class="grid"/>
  <line x1="115" y1="365" x2="1130" y2="365" class="grid"/>
  <line x1="115" y1="260" x2="1130" y2="260" class="grid"/>
  <text x="63" y="370" transform="rotate(-90 63 370)" class="label">Operational complexity</text>
  <text x="500" y="630" class="label">Workload maturity, traffic, team size, and risk</text>

  <path d="M155 535 C280 515 315 470 405 435 C515 392 560 340 665 310 C800 270 880 230 1065 190" class="curve"/>

  <circle cx="170" cy="532" r="14" class="dot"/>
  <rect x="145" y="388" width="210" height="96" rx="16" class="card"/>
  <text x="170" y="424" class="h">1. Baseline</text>
  <text x="170" y="452" class="p">ALB, Auto Scaling,</text>
  <text x="170" y="474" class="p">2 AZs, database backups</text>

  <circle cx="410" cy="433" r="14" class="dot"/>
  <rect x="375" y="286" width="220" height="104" rx="16" class="card"/>
  <text x="400" y="323" class="h">2. Containers</text>
  <text x="400" y="351" class="p">Plug in ECS Fargate when</text>
  <text x="400" y="373" class="p">release boundaries are real</text>

  <circle cx="665" cy="310" r="14" class="dot"/>
  <rect x="630" y="430" width="220" height="104" rx="16" class="card"/>
  <text x="655" y="467" class="h">3. Serverless</text>
  <text x="655" y="495" class="p">Plug in Lambda, SNS,</text>
  <text x="655" y="517" class="p">SQS for event workflows</text>

  <circle cx="865" cy="235" r="14" class="dot"/>
  <rect x="820" y="92" width="230" height="104" rx="16" class="card"/>
  <text x="845" y="129" class="h">4. Governance</text>
  <text x="845" y="157" class="p">OUs, SCPs, SSO, ABAC,</text>
  <text x="845" y="179" class="p">budgets and audit controls</text>

  <circle cx="1065" cy="190" r="14" class="dot"/>
  <rect x="970" y="320" width="230" height="104" rx="16" class="card"/>
  <text x="995" y="357" class="h">5. Edge and record</text>
  <text x="995" y="385" class="p">CDN, API Gateway, WAF,</text>
  <text x="995" y="407" class="p">snapshots and runbooks</text>
</svg>

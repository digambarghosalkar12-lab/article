  <g font-family="Arial, sans-serif"><text x="70" y="94" fill="#b8e4d0" font-size="23" letter-spacing="5">AI, EXPLAINED SIMPLY</text><text x="70" y="157" fill="#f3f7ef" font-size="49" font-weight="700">How AI learns</text><text x="70" y="197" fill="#bed1c6" font-size="24">A student-style journey: learn, test, improve.</text></g>
  <g filter="url(#glow)"><g transform="translate(70 292)"><rect width="176" height="170" rx="22" fill="#e8f4e9"/><circle cx="50" cy="63" r="28" fill="#f29f55"/><path d="M31 63h38M50 44v38" stroke="#173b37" stroke-width="6" stroke-linecap="round"/><text x="26" y="132" fill="#173b37" font-family="Arial,sans-serif" font-size="22" font-weight="700">Examples</text><text x="26" y="153" fill="#52736a" font-family="Arial,sans-serif" font-size="16">apple · orange</text></g><g transform="translate(298 292)"><rect width="176" height="170" rx="22" fill="#8bd9bb"/><path d="M47 62l21 21 59-57" fill="none" stroke="#173b37" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><text x="23" y="132" fill="#173b37" font-family="Arial,sans-serif" font-size="22" font-weight="700">Feedback</text><text x="23" y="153" fill="#315f55" font-family="Arial,sans-serif" font-size="16">check · correct</text></g><g transform="translate(526 292)"><rect width="176" height="170" rx="22" fill="#d5efe1"/><g fill="none" stroke="#173b37" stroke-width="5"><circle cx="48" cy="66" r="10"/><circle cx="90" cy="44" r="10"/><circle cx="124" cy="80" r="10"/><path d="M57 61 81 49M99 50l18 23M58 69l57 7"/></g><text x="23" y="132" fill="#173b37" font-family="Arial,sans-serif" font-size="22" font-weight="700">Patterns</text><text x="23" y="153" fill="#52736a" font-family="Arial,sans-serif" font-size="16">connections</text></g></g>

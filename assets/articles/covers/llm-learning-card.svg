<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">How AI learns from examples</title>
  <desc id="desc">A student-inspired learning journey from examples to feedback, patterns and a useful response.</desc>

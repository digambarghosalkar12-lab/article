<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
 <title id="title">CloudX Step 2 safety boundary</title><desc id="desc">Trusted inputs define a workspace boundary. Safe metadata is ranked and selected text is loaded within limits. Unsafe paths and secrets remain outside. The result reports evidence and omissions.</desc>
 <rect width="1280" height="720" fill="#102747"/><g font-family="Arial,Helvetica,sans-serif"><text x="60" y="64" fill="#76d9eb" font-size="15" font-weight="700" letter-spacing="4">THE READ-ONLY EVIDENCE BOUNDARY</text><text x="60" y="110" fill="#f7f5ef" font-size="30" font-weight="700">The host authorizes the root. The task guides relevance. Neither grants execution.</text>
 <g transform="translate(60 174)"><rect width="254" height="376" rx="12" fill="#f7f5ef"/><text x="24" y="42" fill="#6d786f" font-size="13" font-weight="700" letter-spacing="2">TRUSTED ENVELOPE</text><text x="24" y="88" fill="#102747" font-size="19" font-weight="700">TaskObject</text><text x="24" y="114" fill="#526271" font-size="15">unchanged from Step 1</text><line x1="24" y1="144" x2="230" y2="144" stroke="#102747" opacity=".16"/><text x="24" y="184" fill="#102747" font-size="19" font-weight="700">Workspace root</text><text x="24" y="210" fill="#526271" font-size="15">chosen by trusted host</text><line x1="24" y1="240" x2="230" y2="240" stroke="#102747" opacity=".16"/><text x="24" y="280" fill="#102747" font-size="19" font-weight="700">Hard limits</text><text x="24" y="306" fill="#526271" font-size="15">files · bytes · depth</text><text x="24" y="344" fill="#6d786f" font-size="13">ACTIVE CONTEXT IS</text><text x="24" y="365" fill="#6d786f" font-size="13">UNTRUSTED EVIDENCE</text></g>
 <path d="M332 362h58" stroke="#76d9eb" stroke-width="3"/><path d="m378 350 12 12-12 12" fill="none" stroke="#76d9eb" stroke-width="3"/>
 <g transform="translate(406 150)"><rect width="430" height="424" rx="18" fill="#162e54" stroke="#76d9eb" stroke-width="2"/><text x="28" y="44" fill="#76d9eb" font-size="13" font-weight="700" letter-spacing="2">AUTHORIZED WORKSPACE</text><g fill="#203b68"><rect x="28" y="74" width="374" height="48" rx="7"/><rect x="28" y="136" width="374" height="48" rx="7"/><rect x="28" y="198" width="374" height="48" rx="7"/><rect x="28" y="260" width="374" height="48" rx="7"/><rect x="28" y="322" width="374" height="48" rx="7"/></g><g fill="#f7f5ef" font-size="16"><text x="48" y="104">1 · secure bounded tree</text><text x="48" y="166">2 · languages + read-only Git status</text><text x="48" y="228">3 · instruction metadata, never authority</text><text x="48" y="290">4 · deterministic relevance ranking</text><text x="48" y="352">5 · approved UTF-8 text loading</text></g><text x="28" y="400" fill="#b7c5d9" font-size="13" letter-spacing="1">CONTENT OPENS ONLY HERE · NO WRITES · NO MODEL CALL</text></g>
 <path d="M854 362h58" stroke="#8d6ff1" stroke-width="3"/><path d="m900 350 12 12-12 12" fill="none" stroke="#8d6ff1" stroke-width="3"/>
 <g transform="translate(928 174)"><rect width="292" height="376" rx="12" fill="#f7f5ef"/><text x="24" y="42" fill="#6d786f" font-size="13" font-weight="700" letter-spacing="2">CONTEXTPACKAGE</text><text x="24" y="86" fill="#102747" font-size="18" font-weight="700">Useful evidence</text><text x="24" y="112" fill="#526271" font-size="15">ranked files · loaded text</text><text x="24" y="136" fill="#526271" font-size="15">Git · languages · active context</text><line x1="24" y1="164" x2="268" y2="164" stroke="#102747" opacity=".16"/><text x="24" y="204" fill="#102747" font-size="18" font-weight="700">Honest gaps</text><text x="24" y="230" fill="#526271" font-size="15">rejected · excluded · unreadable</text><text x="24" y="254" fill="#526271" font-size="15">unavailable · truncated</text><line x1="24" y1="282" x2="268" y2="282" stroke="#102747" opacity=".16"/><text x="24" y="322" fill="#102747" font-size="18" font-weight="700">Confidence</text><text x="24" y="348" fill="#526271" font-size="15">completeness, capped at 0.95</text></g>
 <g transform="translate(406 618)"><text x="0" y="0" fill="#f29f8e" font-size="14" font-weight="700" letter-spacing="2">KEPT OUT</text><text x="112" y="0" fill="#b7c5d9" font-size="15">absolute paths · traversal · escaping symlinks · secrets · binaries · instructions as authority</text></g>
 </g>
</svg>

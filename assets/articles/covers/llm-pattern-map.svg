<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">Pattern matching groups familiar fruits into a concept</title><rect width="1280" height="720" fill="#112f33"/><g font-family="Arial,sans-serif"><text x="80" y="95" fill="#bde4d1" font-size="18" letter-spacing="4">PATTERN MATCHING</text><text x="80" y="157" fill="#f4f7ef" font-size="48" font-weight="700">How examples become a useful category</text><text x="80" y="201" fill="#c7d7ce" font-size="24">You see different objects, notice what they have in common, then form a concept.</text></g><g stroke="#9ce5c8" stroke-width="4" fill="none" opacity=".85"><path d="M250 406 610 373M430 535 610 373M435 282 610 373M610 373 970 373"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#eaf4e5"><circle cx="250" cy="406" r="76"/><circle cx="430" cy="535" r="76"/><circle cx="435" cy="282" r="76"/></g><g fill="#163b37" font-size="28" font-weight="700"><text x="250" y="415">Apple</text><text x="430" y="544">Orange</text><text x="435" y="291">Mango</text></g><circle cx="610" cy="373" r="106" fill="#7bd3af"/><text x="610" y="366" fill="#123a35" font-size="34" font-weight="700">Shared</text><text x="610" y="408" fill="#123a35" font-size="34" font-weight="700">pattern</text><rect x="970" y="296" width="218" height="154" rx="24" fill="#dff3e5"/><text x="1079" y="364" fill="#173c38" font-size="31" font-weight="700">FRUIT</text><text x="1079" y="402" fill="#476b61" font-size="20">a useful category</text></g><text x="80" y="651" fill="#c7d7ce" font-family="Arial,sans-serif" font-size="25">An LLM learns patterns in language and context at a much larger scale.</text></svg>

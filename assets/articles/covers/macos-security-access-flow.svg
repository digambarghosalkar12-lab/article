<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Mac security and access flow</title>
  <desc id="desc">A flow showing Jamf compliance, Defender health, Purview protection, and Entra Conditional Access deciding Microsoft 365 access.</desc>
  <rect width="1280" height="720" fill="#f7f5ef"/>
  <text x="80" y="86" fill="#081012" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">Security becomes an access decision</text>
  <text x="82" y="124" fill="#53635e" font-family="Inter, Arial, sans-serif" font-size="20">A Mac is trusted only when identity, device posture, threat state, and data controls agree.</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(90 202)">
      <rect width="260" height="270" rx="24" fill="#eef8f5" stroke="#d7d0c1"/>
      <text x="130" y="58" text-anchor="middle" fill="#081012" font-size="26" font-weight="800">Jamf posture</text>
      <text x="130" y="104" text-anchor="middle" fill="#53635e" font-size="17">FileVault enabled</text>
      <text x="130" y="138" text-anchor="middle" fill="#53635e" font-size="17">OS supported</text>
      <text x="130" y="172" text-anchor="middle" fill="#53635e" font-size="17">Profiles intact</text>
      <text x="130" y="206" text-anchor="middle" fill="#53635e" font-size="17">Security agent healthy</text>
    </g>
    <g transform="translate(390 202)">
      <rect width="260" height="270" rx="24" fill="#edf5ff" stroke="#d7d0c1"/>
      <text x="130" y="58" text-anchor="middle" fill="#081012" font-size="26" font-weight="800">Microsoft signals</text>
      <text x="130" y="104" text-anchor="middle" fill="#53635e" font-size="17">Entra identity</text>
      <text x="130" y="138" text-anchor="middle" fill="#53635e" font-size="17">Defender risk</text>
      <text x="130" y="172" text-anchor="middle" fill="#53635e" font-size="17">Purview DLP</text>
      <text x="130" y="206" text-anchor="middle" fill="#53635e" font-size="17">Session context</text>
    </g>
    <g transform="translate(690 202)">
      <rect width="220" height="270" rx="24" fill="#081012"/>
      <text x="110" y="76" text-anchor="middle" fill="#f7f5ef" font-size="26" font-weight="800">Conditional</text>
      <text x="110" y="112" text-anchor="middle" fill="#f7f5ef" font-size="26" font-weight="800">Access</text>
      <text x="110" y="164" text-anchor="middle" fill="#d6c8a8" font-size="17">Allow, block,</text>
      <text x="110" y="194" text-anchor="middle" fill="#d6c8a8" font-size="17">or require</text>
      <text x="110" y="224" text-anchor="middle" fill="#d6c8a8" font-size="17">remediation</text>
    </g>
    <g transform="translate(950 202)">
      <rect width="240" height="120" rx="24" fill="#15936b"/>
      <text x="120" y="52" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">Allow</text>
      <text x="120" y="86" text-anchor="middle" fill="#eafaf4" font-size="17">Microsoft 365 access</text>
      <rect y="150" width="240" height="120" rx="24" fill="#b42318"/>
      <text x="120" y="202" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">Block</text>
      <text x="120" y="236" text-anchor="middle" fill="#ffe8e4" font-size="17">Unmanaged or risky</text>
    </g>
  </g>
  <path d="M350 337 H390 M650 337 H690 M910 292 H950 M910 392 H950" fill="none" stroke="#cdbf9e" stroke-width="5" stroke-linecap="round"/>
  <text x="640" y="592" text-anchor="middle" fill="#081012" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Compliance is not a report only.</text>
  <text x="640" y="628" text-anchor="middle" fill="#081012" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">It becomes the gate to email, files, Teams, and apps.</text>
</svg>

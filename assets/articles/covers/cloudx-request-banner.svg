<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">CloudX request understanding flow</title>
  <desc id="desc">Request and context enter CloudX, use an approved model provider, and leave as a validated Task Object.</desc>
  <rect width="1280" height="420" fill="#102747"/>
  <circle cx="1195" cy="-24" r="182" fill="#7657e8" opacity=".16"/>
  <circle cx="42" cy="445" r="170" fill="#56c2dd" opacity=".10"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="58" fill="#76d9eb" font-size="14" font-weight="700" letter-spacing="4">CLOUDX · REQUEST UNDERSTANDING</text>
    <text x="60" y="108" fill="#f7f5ef" font-size="34" font-weight="700">From human language to a trusted task contract</text>
    <text x="60" y="140" fill="#b7c5d9" font-size="17">Interpret first. Expose uncertainty. Execute later.</text>
  </g>

  <g transform="translate(60 208)" font-family="Arial, Helvetica, sans-serif">
    <rect width="200" height="126" rx="10" fill="#f7f5ef"/>
    <text x="22" y="36" fill="#6d786f" font-size="13" font-weight="700" letter-spacing="2">INPUT ENVELOPE</text>
    <text x="22" y="72" fill="#102747" font-size="18" font-weight="700">User request</text>
    <text x="22" y="99" fill="#526271" font-size="16">+ immediate context</text>
  </g>

  <path d="M276 271h54" stroke="#76d9eb" stroke-width="3" stroke-linecap="round"/>
  <path d="m318 259 12 12-12 12" fill="none" stroke="#76d9eb" stroke-width="3"/>

  <g transform="translate(346 192)" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect width="230" height="158" rx="79" fill="#58c2db"/>
    <text x="115" y="67" fill="#102747" font-size="24" font-weight="700">CloudX</text>
    <text x="115" y="99" fill="#102747" font-size="13" font-weight="700" letter-spacing="2">UNDERSTAND</text>
    <text x="115" y="124" fill="#102747" font-size="13" letter-spacing="2">PRESERVE · VALIDATE</text>
  </g>

  <path d="M592 271h54" stroke="#76d9eb" stroke-width="3" stroke-linecap="round"/>
  <path d="m634 259 12 12-12 12" fill="none" stroke="#76d9eb" stroke-width="3"/>

  <g transform="translate(662 184)" font-family="Arial, Helvetica, sans-serif">
    <rect width="242" height="174" rx="10" fill="#182e56" stroke="#8397b7" stroke-opacity=".42"/>
    <text x="20" y="33" fill="#b7c5d9" font-size="12" font-weight="700" letter-spacing="2">APPROVED PROVIDER</text>
    <rect x="20" y="54" width="202" height="30" rx="5" fill="#39204d"/><text x="121" y="75" fill="#fff" font-size="14" text-anchor="middle">Local Ollama</text>
    <rect x="20" y="94" width="202" height="30" rx="5" fill="#263d84"/><text x="121" y="115" fill="#fff" font-size="14" text-anchor="middle">Microsoft Foundry</text>
    <rect x="20" y="134" width="202" height="30" rx="5" fill="#641832"/><text x="121" y="155" fill="#fff" font-size="14" text-anchor="middle">Amazon Bedrock</text>
  </g>

  <path d="M920 271h54" stroke="#8d6ff1" stroke-width="3" stroke-linecap="round"/>
  <path d="m962 259 12 12-12 12" fill="none" stroke="#8d6ff1" stroke-width="3"/>

  <g transform="translate(990 208)" font-family="Arial, Helvetica, sans-serif">
    <rect width="230" height="126" rx="10" fill="#f7f5ef"/>
    <text x="22" y="36" fill="#6d786f" font-size="13" font-weight="700" letter-spacing="2">VALIDATED OUTPUT</text>
    <text x="22" y="72" fill="#102747" font-size="20" font-weight="700">Task Object</text>
    <path d="M22 96h112M22 108h154" stroke="#526271" stroke-width="3" stroke-linecap="round" opacity=".58"/>
    <circle cx="200" cy="100" r="10" fill="#54c99b"/>
  </g>
</svg>

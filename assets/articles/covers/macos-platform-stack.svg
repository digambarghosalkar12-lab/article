<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Mac enterprise platform stack</title>
  <desc id="desc">A layered map showing Apple, Apple Business Manager, Jamf Pro, Microsoft 365 E7, and AppleCare working together for enterprise Mac management.</desc>
  <rect width="1280" height="720" fill="#f7f5ef"/>
  <path d="M0 610 C180 540 290 650 458 572 C650 482 790 622 984 548 C1110 498 1180 520 1280 468 L1280 720 L0 720 Z" fill="#e9e4d9"/>
  <text x="80" y="88" fill="#081012" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">Mac enterprise platform</text>
  <text x="82" y="126" fill="#53635e" font-family="Inter, Arial, sans-serif" font-size="20">Use each platform for the job it is strongest at.</text>

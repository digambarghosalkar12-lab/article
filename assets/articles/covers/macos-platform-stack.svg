    <text x="105" y="182" text-anchor="middle" fill="#53635e" font-family="Inter, Arial, sans-serif" font-size="17">Hardware</text>
    <text x="105" y="212" text-anchor="middle" fill="#53635e" font-family="Inter, Arial, sans-serif" font-size="17">macOS security</text>
    <text x="105" y="242" text-anchor="middle" fill="#53635e" font-family="Inter, Arial, sans-serif" font-size="17">Secure Enclave</text>
    <text x="105" y="272" text-anchor="middle" fill="#53635e" font-family="Inter, Arial, sans-serif" font-size="17">FileVault</text>

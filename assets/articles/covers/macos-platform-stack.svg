  <path d="M198 558 H1082" stroke="#b7aa92" stroke-width="4" stroke-linecap="round"/>
  <text x="640" y="628" text-anchor="middle" fill="#081012" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">Secure endpoint + managed lifecycle + enterprise identity + productivity + support</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.18"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <text x="600" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Jamf Script Uploader Architecture</text>
  <text x="600" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">Interactive macOS workflow using Jamf API client credentials</text>

  <g filter="url(#shadow)">
    <rect x="60" y="185" width="250" height="220" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="185" cy="245" r="36" fill="#dbeafe"/>
    <path d="M166 244h38M185 225v38" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <text x="185" y="315" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Administrator</text>
    <text x="185" y="350" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Selects type and file</text>
    <text x="185" y="376" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Provides display name</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="145" width="290" height="300" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="505" y="195" width="190" height="115" rx="12" fill="#0f172a"/>
    <text x="525" y="225" font-family="Menlo, monospace" font-size="14" fill="#a7f3d0">$ ./jamf-script-</text>
    <text x="525" y="250" font-family="Menlo, monospace" font-size="14" fill="#a7f3d0">  uploader.sh</text>
    <text x="525" y="281" font-family="Menlo, monospace" font-size="13" fill="#e2e8f0">Uploading...</text>
    <text x="600" y="355" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Uploader</text>
    <text x="600" y="388" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Validates and Base64 encodes</text>
    <text x="600" y="414" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Adds YYYYMMDD_HHMMSS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="890" y="185" width="250" height="220" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M965 238c0-22 18-40 40-40h20c22 0 40 18 40 40v60c0 22-18 40-40 40h-20c-22 0-40-18-40-40z" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <circle cx="1015" cy="248" r="13" fill="#16a34a"/>
    <path d="M995 282h40M995 305h40" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
    <text x="1015" y="355" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Jamf Pro</text>
    <text x="1015" y="382" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">OAuth token + Classic API</text>
  </g>

  <line x1="310" y1="295" x2="445" y2="295" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="378" y="275" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">Input</text>
  <line x1="745" y1="260" x2="880" y2="260" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="238" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">1. Request token</text>
  <line x1="880" y1="330" x2="755" y2="330" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="817" y="365" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">2. Bearer token</text>
  <line x1="745" y1="400" x2="880" y2="400" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="430" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">3. Upload XML</text>

  <rect x="230" y="515" width="740" height="60" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="600" y="552" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#3730a3">Defaults: Category = None · Priority = After · Info, Notes and Parameters = blank</text>
</svg>

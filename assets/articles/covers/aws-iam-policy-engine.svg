<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AWS policy evaluation model</title>
  <desc id="desc">A visual equation showing IAM allow intersecting with SCPs, permissions boundaries, session policies, resource policies, and explicit deny.</desc>
  <rect width="1280" height="720" fill="#f7f5ef"/>
  <text x="72" y="82" fill="#081012" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">Effective access is the intersection</text>
  <text x="74" y="122" fill="#56615c" font-family="Inter, Arial, sans-serif" font-size="20">IAM may allow an action, but guardrails and resource policies decide the final outcome.</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(92 210)">
      <rect width="210" height="132" rx="22" fill="#edf5ff" stroke="#d7d0c1"/>
      <text x="105" y="56" text-anchor="middle" fill="#081012" font-size="23" font-weight="800">IAM policy</text>
      <text x="105" y="92" text-anchor="middle" fill="#56615c" font-size="17">What identity can do</text>
    </g>
    <g transform="translate(326 210)">
      <rect width="210" height="132" rx="22" fill="#fff3e8" stroke="#d7d0c1"/>
      <text x="105" y="56" text-anchor="middle" fill="#081012" font-size="23" font-weight="800">SCP</text>
      <text x="105" y="92" text-anchor="middle" fill="#56615c" font-size="17">Account maximum</text>
    </g>
    <g transform="translate(560 210)">
      <rect width="210" height="132" rx="22" fill="#eef8f5" stroke="#d7d0c1"/>
      <text x="105" y="56" text-anchor="middle" fill="#081012" font-size="23" font-weight="800">Boundary</text>
      <text x="105" y="92" text-anchor="middle" fill="#56615c" font-size="17">Role maximum</text>
    </g>
    <g transform="translate(794 210)">
      <rect width="210" height="132" rx="22" fill="#fffaf0" stroke="#d7d0c1"/>
      <text x="105" y="56" text-anchor="middle" fill="#081012" font-size="23" font-weight="800">Session policy</text>
      <text x="105" y="92" text-anchor="middle" fill="#56615c" font-size="17">Temporary scope</text>
    </g>
    <g transform="translate(1028 210)">
      <rect width="160" height="132" rx="22" fill="#ffffff" stroke="#d7d0c1"/>
      <text x="80" y="56" text-anchor="middle" fill="#081012" font-size="23" font-weight="800">Resource</text>
      <text x="80" y="92" text-anchor="middle" fill="#56615c" font-size="17">Bucket/KMS</text>
    </g>
    <path d="M198 370 H1082" stroke="#b9ad94" stroke-width="5" stroke-linecap="round"/>
    <rect x="300" y="418" width="680" height="128" rx="24" fill="#081012"/>
    <text x="640" y="466" text-anchor="middle" fill="#f7f5ef" font-size="27" font-weight="800">Allowed only when every</text>
    <text x="640" y="500" text-anchor="middle" fill="#f7f5ef" font-size="27" font-weight="800">required layer allows</text>
    <text x="640" y="528" text-anchor="middle" fill="#d6c8a8" font-size="17">Any explicit deny wins over an allow.</text>
    <rect x="438" y="586" width="404" height="56" rx="18" fill="#b42318"/>
    <text x="640" y="616" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">Explicit deny = stop at the door</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Zero-touch Mac onboarding flow</title>
  <desc id="desc">A zero-touch onboarding flow from shipped Mac to Apple Business Manager, Jamf, Entra SSO, security controls, and Self Service readiness.</desc>
  <rect width="1280" height="720" fill="#f7f5ef"/>
  <text x="80" y="88" fill="#081012" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">Zero-touch onboarding</text>
  <text x="82" y="126" fill="#53635e" font-family="Inter, Arial, sans-serif" font-size="20">The employee opens the Mac; ownership, enrollment, identity, and security arrive automatically.</text>
  <g fill="none" stroke="#cdbf9e" stroke-width="4" stroke-linecap="round">
    <path d="M230 330 H392"/><path d="M450 330 H612"/><path d="M670 330 H832"/><path d="M890 330 H1052"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(92 214)">
      <rect width="230" height="232" rx="24" fill="#ffffff" stroke="#d7d0c1"/>
      <rect x="60" y="58" width="110" height="72" rx="10" fill="#101820"/>
      <rect x="76" y="72" width="78" height="44" rx="4" fill="#d8ece8"/>
      <path d="M50 146 H180 L200 174 H30 Z" fill="#a9b6b0"/>
      <text x="115" y="206" text-anchor="middle" fill="#081012" font-size="22" font-weight="800">Mac ships to user</text>
    </g>
    <g transform="translate(312 214)">
      <rect width="230" height="232" rx="24" fill="#fffaf0" stroke="#d7d0c1"/>
      <circle cx="115" cy="90" r="44" fill="#1d4ed8"/>
      <text x="115" y="101" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">ABM</text>
      <text x="115" y="174" text-anchor="middle" fill="#081012" font-size="22" font-weight="800">Ownership</text>
      <text x="115" y="204" text-anchor="middle" fill="#53635e" font-size="17">ADE assignment</text>
    </g>
    <g transform="translate(532 214)">
      <rect width="230" height="232" rx="24" fill="#eef8f5" stroke="#d7d0c1"/>
      <circle cx="115" cy="90" r="44" fill="#15936b"/>
      <text x="115" y="101" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">J</text>
      <text x="115" y="174" text-anchor="middle" fill="#081012" font-size="22" font-weight="800">Jamf enrolls</text>
      <text x="115" y="204" text-anchor="middle" fill="#53635e" font-size="17">Profiles + apps</text>
    </g>
    <g transform="translate(752 214)">
      <rect width="230" height="232" rx="24" fill="#edf5ff" stroke="#d7d0c1"/>
      <circle cx="115" cy="90" r="44" fill="#2563eb"/>
      <text x="115" y="101" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">SSO</text>
      <text x="115" y="174" text-anchor="middle" fill="#081012" font-size="22" font-weight="800">Entra sign-in</text>
      <text x="115" y="204" text-anchor="middle" fill="#53635e" font-size="17">Touch ID + CA</text>
    </g>
    <g transform="translate(972 214)">
      <rect width="230" height="232" rx="24" fill="#fff3e8" stroke="#d7d0c1"/>
      <circle cx="115" cy="90" r="44" fill="#d97706"/>
      <text x="115" y="101" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">✓</text>
      <text x="115" y="174" text-anchor="middle" fill="#081012" font-size="22" font-weight="800">Ready to work</text>
      <text x="115" y="204" text-anchor="middle" fill="#53635e" font-size="17">Defender + Self Service</text>
    </g>
  </g>
  <text x="640" y="586" text-anchor="middle" fill="#081012" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">No imaging queue. No manual build desk.</text>
  <text x="640" y="622" text-anchor="middle" fill="#081012" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">No waiting for IT to touch every Mac.</text>
</svg>

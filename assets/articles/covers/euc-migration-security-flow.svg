<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">FileVault and bootstrap token security flow</title>
  <desc id="desc">Diagram showing old Jamf FileVault recovery key retrieval, new MDM escrow, bootstrap token re-escrow, and local user validation.</desc>
  <rect width="1280" height="720" fill="#f7f5ef"/>
  <style>
    .title{font:700 34px Arial,Helvetica,sans-serif;fill:#081012}
    .sub{font:400 18px Arial,Helvetica,sans-serif;fill:#59645d}
    .box{fill:#fffaf0;stroke:#123230;stroke-width:3}
    .green{fill:#123230}
    .gold{fill:#d1a05f}
    .txt{font:700 22px Arial,Helvetica,sans-serif;fill:#081012}
    .small{font:400 17px Arial,Helvetica,sans-serif;fill:#3b4642}
    .white{fill:#f7f5ef}
    .line{fill:none;stroke:#123230;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <text x="60" y="62" class="title">Security handoff during migration</text>
  <text x="60" y="96" class="sub">Recovery and authorization state are transferred and revalidated before the Mac is marked complete.</text>

  <rect x="70" y="170" width="250" height="132" rx="14" class="box"/>
  <text x="100" y="213" class="txt">Old Jamf MDM</text>
  <text x="100" y="246" class="small">FileVault PRK retrieved</text>
  <text x="100" y="272" class="small">through controlled API</text>

  <rect x="405" y="170" width="250" height="132" rx="14" class="box"/>
  <text x="435" y="213" class="txt">Local daemon</text>
  <text x="435" y="246" class="small">holds migration state</text>
  <text x="435" y="272" class="small">and validates outcomes</text>

  <rect x="740" y="170" width="250" height="132" rx="14" class="box"/>
  <text x="770" y="213" class="txt">New MDM</text>
  <text x="770" y="246" class="small">escrow recovery key</text>
  <text x="770" y="272" class="small">and management state</text>

  <rect x="405" y="440" width="250" height="132" rx="14" class="box"/>
  <text x="435" y="483" class="txt">profiles binary</text>
  <text x="435" y="516" class="small">bootstrap token status</text>
  <text x="435" y="542" class="small">enrollment validation</text>

  <rect x="740" y="440" width="250" height="132" rx="14" class="gold"/>
  <text x="770" y="483" class="txt">Local user</text>
  <text x="770" y="516" class="small">Secure Token, admin,</text>
  <text x="770" y="542" class="small">FileVault readiness</text>

  <path d="M320 236h85M655 236h85M865 302v138M655 506h85" class="line"/>
  <circle cx="1080" cy="236" r="76" class="green"/>
  <text x="1080" y="225" text-anchor="middle" class="white" style="font:700 20px Arial">recoverable</text>
  <text x="1080" y="253" text-anchor="middle" class="white" style="font:700 20px Arial">managed Mac</text>
  <path d="M990 236h14" class="line"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">The student and AI improvement cycle</title><desc id="desc">A visual comparison of learning, testing, feedback and an improved version.</desc>
  <rect width="1280" height="720" fill="#e9e4d9"/><g font-family="Arial,sans-serif"><text x="80" y="94" fill="#61736b" font-size="18" letter-spacing="4">LEARN · CHECK · IMPROVE</text><text x="80" y="155" fill="#173b37" font-size="48" font-weight="700">Why practice and feedback matter</text><text x="80" y="199" fill="#52635d" font-size="24">A student improves through teachers and tests. AI improves through training, evaluation, and human-led updates.</text></g>
  <g transform="translate(80 284)" font-family="Arial,sans-serif"><rect width="237" height="258" rx="22" fill="#d7eee0"/><text x="29" y="53" fill="#315d53" font-size="17" letter-spacing="3">STUDENT</text><text x="28" y="105" fill="#173b37" font-size="28" font-weight="700">Learns lessons</text><text x="28" y="145" fill="#52635d" font-size="20">Practises examples</text><text x="28" y="185" fill="#52635d" font-size="20">Takes a test</text><text x="28" y="225" fill="#52635d" font-size="20">Gets feedback</text><path d="M210 91v128" stroke="#3b7b6a" stroke-width="5" stroke-linecap="round"/><path d="m199 207 11 12 11-12" fill="none" stroke="#3b7b6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(522 284)" font-family="Arial,sans-serif"><rect width="237" height="258" rx="22" fill="#173c38"/><text x="29" y="53" fill="#bfe5d2" font-size="17" letter-spacing="3">AI MODEL</text><text x="28" y="105" fill="#f3f7ef" font-size="28" font-weight="700">Trains on data</text><text x="28" y="145" fill="#c4d7ce" font-size="20">Is evaluated</text><text x="28" y="185" fill="#c4d7ce" font-size="20">Gets human feedback</text><text x="28" y="225" fill="#c4d7ce" font-size="20">Is refined &amp; released</text><path d="M210 91v128" stroke="#8edfc0" stroke-width="5" stroke-linecap="round"/><path d="m199 207 11 12 11-12" fill="none" stroke="#8edfc0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(964 284)" font-family="Arial,sans-serif"><rect width="237" height="258" rx="22" fill="#d7eee0"/><text x="29" y="53" fill="#315d53" font-size="17" letter-spacing="3">IMPORTANT</text><text x="28" y="108" fill="#173b37" font-size="28" font-weight="700">Neither one</text><text x="28" y="147" fill="#173b37" font-size="28" font-weight="700">improves alone.</text><text x="28" y="198" fill="#52635d" font-size="19">Teaching, checks, and</text><text x="28" y="224" fill="#52635d" font-size="19">feedback shape progress.</text></g>
  <path d="M317 413h205m237 0h205" stroke="#3b7b6a" stroke-width="5" stroke-dasharray="11 12"/><path d="m500 401 18 12-18 12m422-24 18 12-18 12" fill="none" stroke="#3b7b6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">Foundation learning branches into specialised AI capabilities</title><rect width="1280" height="720" fill="#112f33"/><g font-family="Arial,sans-serif"><text x="80" y="92" fill="#bde4d1" font-size="18" letter-spacing="4">FOUNDATION → SPECIALISATION</text><text x="80" y="152" fill="#f4f7ef" font-size="45" font-weight="700">Broad learning, focused work</text><text x="80" y="195" fill="#c7d7ce" font-size="23">A broad foundation can be adapted for a specific job.</text></g><g fill="none" stroke="#8edfc0" stroke-width="4" opacity=".8"><path d="M374 400h150M604 400c104 0 102-159 196-159M604 400c104 0 102-53 196-53M604 400c104 0 102 53 196 53M604 400c104 0 102 159 196 159"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="78" y="321" width="296" height="156" rx="24" fill="#dff3e5"/><text x="226" y="381" fill="#173b37" font-size="29" font-weight="700">Broad foundation</text><text x="226" y="420" fill="#477066" font-size="20">language + examples</text><circle cx="604" cy="400" r="66" fill="#77d0ac"/><text x="604" y="409" fill="#153c38" font-size="23" font-weight="700">MODEL</text><g fill="#dff3e5"><rect x="800" y="184" width="318" height="110" rx="18"/><rect x="800" y="300" width="318" height="110" rx="18"/><rect x="800" y="416" width="318" height="110" rx="18"/><rect x="800" y="532" width="318" height="110" rx="18"/></g><g fill="#173b37" font-size="25" font-weight="700"><text x="959" y="252">Writing &amp; analysis</text><text x="959" y="368">Coding</text><text x="959" y="484">Images &amp; vision</text><text x="959" y="600">Voice &amp; documents</text></g></g><text x="80" y="670" fill="#c7d7ce" font-family="Arial,sans-serif" font-size="23">Different models and tools can be adapted for different jobs.</text></svg>

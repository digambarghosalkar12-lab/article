<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="505" viewBox="0 0 1200 505" role="img" aria-labelledby="title desc"><title id="title">Build recursively. Verify locally.</title><desc id="desc">Keep master guides and templates immutable; work from copies.</desc><rect width="1200" height="505" fill="#f7f5ef"/><g font-family="Arial,sans-serif"><text x="48" y="65" font-size="36" fill="#182f29">Build recursively. Verify locally.</text><text x="48" y="110" font-size="22" fill="#485a50">Keep master guides and templates immutable; work from copies.</text><rect x="48" y="150" width="1104" height="85" rx="10" fill="#183c32"/><text x="72" y="184" font-size="25" fill="#ffffff">01  Global Rules → Guide → Working Template/State</text><text x="72" y="214" font-size="20" fill="#ffffff">Discussion → Checkpoint → Approval</text><rect x="48" y="255" width="1104" height="85" rx="10" fill="#e2e8dd"/><text x="72" y="289" font-size="25" fill="#183c32">02  Generate → Validate → Functional Test</text><text x="72" y="319" font-size="20" fill="#183c32">Within a Plugin, descend into one Skill and its required MCP capability.</text><rect x="48" y="360" width="1104" height="85" rx="10" fill="#183c32"/><text x="72" y="394" font-size="25" fill="#ffffff">03  Register → Compact → Resume</text><text x="72" y="424" font-size="20" fill="#ffffff">Return to the parent with evidence; build Hooks after all prerequisites are verified.</text></g></svg>
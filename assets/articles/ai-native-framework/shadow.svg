<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="505" viewBox="0 0 1200 505" role="img" aria-labelledby="title desc"><title id="title">Evaluate beside the project.</title><desc id="desc">Security and improvement evaluators cannot modify the real project.</desc><rect width="1200" height="505" fill="#f7f5ef"/><g font-family="Arial,sans-serif"><text x="48" y="65" font-size="36" fill="#182f29">Evaluate beside the project.</text><text x="48" y="110" font-size="22" fill="#485a50">Security and improvement evaluators cannot modify the real project.</text><rect x="48" y="150" width="1104" height="85" rx="10" fill="#183c32"/><text x="72" y="184" font-size="25" fill="#ffffff">Real project → isolated evaluation input</text><text x="72" y="214" font-size="20" fill="#ffffff">Read permitted material; test in a separate environment.</text><rect x="48" y="255" width="1104" height="85" rx="10" fill="#e2e8dd"/><text x="72" y="289" font-size="25" fill="#183c32">Shadow evaluation → findings and evidence</text><text x="72" y="319" font-size="20" fill="#183c32">Report security risks or improvement candidates; do not apply changes.</text><rect x="48" y="360" width="1104" height="85" rx="10" fill="#183c32"/><text x="72" y="394" font-size="25" fill="#ffffff">Review → normal approved build workflow</text><text x="72" y="424" font-size="20" fill="#ffffff">Any accepted change returns through validation and functional testing.</text></g></svg>
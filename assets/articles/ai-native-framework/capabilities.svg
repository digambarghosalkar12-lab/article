<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="505" viewBox="0 0 1200 505" role="img" aria-labelledby="title desc"><title id="title">Separate responsibility. Explicit capability.</title><desc id="desc">GLOBAL-RULES governs the project and every independently understandable component.</desc><rect width="1200" height="505" fill="#f7f5ef"/><g font-family="Arial,sans-serif"><text x="48" y="65" font-size="36" fill="#182f29">Separate responsibility. Explicit capability.</text><text x="48" y="110" font-size="22" fill="#485a50">GLOBAL-RULES governs the project and every independently understandable component.</text><rect x="48" y="150" width="1104" height="85" rx="10" fill="#183c32"/><text x="72" y="184" font-size="25" fill="#ffffff">Agent | independent top-level capability</text><text x="72" y="214" font-size="20" fill="#ffffff">Never embedded inside a Plugin.</text><rect x="48" y="255" width="1104" height="85" rx="10" fill="#e2e8dd"/><text x="72" y="289" font-size="25" fill="#183c32">Plugin → Skill → MCP | capability hierarchy</text><text x="72" y="319" font-size="20" fill="#183c32">Build one Skill/MCP capability unit at a time; grant only required permissions.</text><rect x="48" y="360" width="1104" height="85" rx="10" fill="#183c32"/><text x="72" y="394" font-size="25" fill="#ffffff">Hook | automation built last</text><text x="72" y="424" font-size="20" fill="#ffffff">Generate only after the Plugin, its Skills, and its MCPs are verified.</text></g></svg>